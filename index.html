<style>
:root{--bg:#eef4ff;--card:#fff;--ink:#0f1f3d;--muted:#5a6b8c;--line:#d6e2f7;--accent:#1f5fe0;--accent-ink:#fff;--sky:#0284c7;--shadow:rgba(20,60,160,.16);--display:"Unbounded","Trebuchet MS",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0a1428;--card:#11213f;--ink:#e8f0ff;--muted:#8fa6cc;--line:#1f3560;--accent:#5aa2ff;--accent-ink:#06142b;--sky:#38bdf8;--shadow:rgba(0,0,0,.45)}.tag.nota{color:#06142b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:focus:not(:focus-visible){outline:none}
.btn,.langs button,.logo,.tag{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 40% at 90% -8%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),radial-gradient(50% 35% at -5% 0%,color-mix(in srgb,var(--sky) 14%,transparent),transparent)}
main{max-width:720px;margin:0 auto;padding:24px 16px calc(56px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:36px}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1rem}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--card);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent);animation:sonar 2.8s ease-out infinite;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.logo:active{transform:scale(.88) rotate(6deg)}
@keyframes sonar{0%{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent),0 0 0 4px color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent),0 0 0 18px transparent}}
.langs{margin-left:auto;display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.langs button{position:relative;overflow:hidden;font-size:.8125rem;font-weight:600;padding:6px 10px;border-radius:8px;border:0;background:transparent;transition:background .2s,color .2s}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,7vw,2.75rem);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 14px;max-width:38ch}
.count{display:inline-block;margin:0 0 20px;padding:3px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:.8125rem;font-weight:600}
.search{display:block;width:100%;padding:13px 16px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;transition:box-shadow .25s,border-color .25s}
.search:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s}
li:active{transform:scale(.985)}
.tag{flex:none;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.75rem}
.tag.nota{background:linear-gradient(135deg,var(--accent),var(--sky))}
.tag svg{transition:transform .3s}
@keyframes nota{0%,100%{transform:none}30%{transform:rotate(-16deg) scale(1.15)}65%{transform:rotate(10deg) scale(1.05)}}
.info{flex:1;min-width:0}
.name{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.size{color:var(--muted);font-size:.8125rem}
.btn{position:relative;overflow:hidden;flex:none;display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-weight:600;text-decoration:none;transition:background .2s,color .2s,transform .15s}
.btn:active{transform:scale(.94)}
.btn.feito svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@media(hover:hover){
.langs button:not([aria-pressed="true"]):hover{background:var(--line)}
li:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 26px var(--shadow)}
li:hover .tag svg{animation:nota .7s ease-in-out}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn:hover svg{animation:baixa .8s ease-in-out infinite}
.logo:hover{transform:rotate(-8deg) scale(1.1)}
}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.3;transform:scale(0);animation:clique .6s ease-out forwards}
@keyframes clique{to{transform:scale(1);opacity:0}}
@keyframes baixa{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.msg h2{margin:0 0 8px;font-size:1.125rem}.msg p{margin:0 0 8px}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:.875rem}
.entra{animation:sobe .6s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes sobe{from{opacity:0;transform:translateY(14px)}}
@media(max-width:480px){.btn .txt{display:none}.btn{padding:12px}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>

    notGithub: ["El sitio aún no está en GitHub", "Esta página muestra los archivos de la carpeta «{p}» de tu repositorio. Solo funciona después de publicarla en GitHub Pages.", "Si usas otra dirección, completa el usuario y el repositorio en CONFIG, al inicio del código."],
    noFolder: ["No se encontró la carpeta", "Crea una carpeta llamada «{p}» en el repositorio y sube los archivos dentro de ella."],
    empty: ["Aún no hay pistas", "Sube archivos a la carpeta «{p}» del repositorio y aparecerán aquí."],
    fail: ["No se pudo cargar la lista", "Revisa tu conexión e inténtalo de nuevo en unos minutos. GitHub limita cuántas consultas puede hacer cada persona por hora."] },
  pt: { nome: "Português (Brasil)", rotulo: "PT", html: "pt-BR",
    titulo: "Downloads de música", aba: "Músicas de {a}", subtitulo: "Escolha a faixa e toque em Baixar.",
    rodape: "Músicas de {a}", busca: "Buscar faixas", baixar: "Baixar",
    contar: n => n + (n === 1 ? " faixa" : " faixas"),
    loading: ["Carregando", "Buscando a lista de faixas…"],
    nothing: ["Nada encontrado", "Nenhuma faixa tem esse nome. Tente outra palavra."],
    notGithub: ["O site ainda não está no GitHub", "Esta página lista os arquivos da pasta “{p}” do seu repositório. Ela só funciona depois de publicada no GitHub Pages.", "Se for usar outro endereço, preencha usuário e repositório na CONFIG, no começo do código."],
    noFolder: ["Pasta não encontrada", "Crie a pasta “{p}” no repositório e envie os arquivos para dentro dela."],
    empty: ["Nenhuma faixa ainda", "Envie arquivos para a pasta “{p}” do repositório e eles aparecem aqui."],
    fail: ["Não foi possível carregar a lista", "Verifique a conexão e tente de novo em alguns minutos. O GitHub limita a quantidade de consultas por pessoa por hora."] }
};

const ICON = {
  down: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3v10.2l3.6-3.6L17 11l-5 5-5-5 1.4-1.4 3.6 3.6V3zM5 19h14v2H5z"/></svg>',
  ok: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
  nota: '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>'
};
const AUDIO_EXT = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "opus", "weba"];

const $ = id => document.getElementById(id);
const area = $("area"), busca = $("busca"), contagem = $("contagem"), langsBox = $("langs");

let idioma = IDIOMAS[CONFIG.idiomaPadrao] ? CONFIG.idiomaPadrao : "en";
try { const s = localStorage.getItem("idioma"); if (s && IDIOMAS[s]) idioma = s; } catch (e) {}

let arquivos = [], estado = "loading", primeira = true;

const T = () => IDIOMAS[idioma];
const sub = s => s.replace("{a}", CONFIG.autor).replace("{p}", CONFIG.pasta);
const ehAudio = n => AUDIO_EXT.includes(n.split(".").pop().toLowerCase());
const titulo = n => n.replace(/\.[^.]+$/, "");

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function detectar() {
  const host = location.hostname;
  let u = CONFIG.usuario, r = CONFIG.repositorio;
  if (host.endsWith(".github.io")) {
    if (!u) u = host.split(".")[0];
    if (!r) { const seg = location.pathname.split("/")[1]; r = seg && !seg.includes(".") ? seg : host; }
  }
  return { u, r };
}

function tamanho(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(0) + " KB";
  if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
  return (b / 1073741824).toFixed(2) + " GB";
}

function cor(ext) {
  let h = 0;
  for (const c of ext) h = (h * 31 + c.charCodeAt(0)) % 360;
  return "hsl(" + h + ",50%,40%)";
}

function mensagem(chave) {
  const m = T()[chave], box = el("div", "msg entra");
  box.style.setProperty("--i", 5);
  box.appendChild(el("h2", "", sub(m[0])));
  m.slice(1).forEach(t => box.appendChild(el("p", "", sub(t))));
  area.replaceChildren(box);
}

function desenhar() {
  const termo = busca.value.trim().toLowerCase();
  const lista = arquivos.filter(a => a.name.toLowerCase().includes(termo));
  contagem.textContent = T().contar(lista.length);
  if (!lista.length) { mensagem("nothing"); return; }
  const ul = el("ul");
  lista.forEach((a, i) => {
    const li = el("li", primeira ? "entra" : "");
    li.style.setProperty("--i", Math.min(i, 10) + 5);
    let tag;
    if (ehAudio(a.name)) {
      tag = el("div", "tag nota");
      tag.innerHTML = ICON.nota;
    } else {
      const ext = a.name.includes(".") ? a.name.split(".").pop() : "file";
      tag = el("div", "tag", ext.slice(0, 4).toUpperCase());
      tag.style.background = cor(ext.toLowerCase());
    }
    const info = el("div", "info"), nome = el("span", "name", titulo(a.name));
    nome.title = a.name;
    info.append(nome, el("span", "size", tamanho(a.size)));
    const d = el("a", "btn");
    d.href = CONFIG.pasta + "/" + encodeURIComponent(a.name);
    d.setAttribute("download", a.name);
    d.setAttribute("aria-label", T().baixar + ": " + titulo(a.name));
    d.innerHTML = ICON.down;
    d.appendChild(el("span", "txt", T().baixar));
    d.addEventListener("click", () => {
      d.classList.add("feito");
      d.querySelector("svg").outerHTML = ICON.ok;
      setTimeout(() => { d.classList.remove("feito"); d.querySelector("svg").outerHTML = ICON.down; }, 1800);
    });
    li.append(tag, info, d);
    ul.appendChild(li);
  });
  area.replaceChildren(ul);
  primeira = false;
}

function aplicarIdioma() {
  const t = T();
  document.documentElement.lang = t.html;
  document.title = sub(t.aba);
  $("autor").textContent = CONFIG.autor;
  $("titulo").textContent = t.titulo;
  $("subtitulo").textContent = t.subtitulo;
  $("rodape").textContent = sub(t.rodape);
  busca.placeholder = t.busca;
  busca.setAttribute("aria-label", t.busca);
  langsBox.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === idioma)));
  if (estado === "lista") desenhar(); else mensagem(estado);
}

Object.keys(IDIOMAS).forEach(cod => {
  const b = el("button", "", IDIOMAS[cod].rotulo);
  b.type = "button";
  b.dataset.lang = cod;
  b.title = IDIOMAS[cod].nome;
  b.lang = IDIOMAS[cod].html;
  b.addEventListener("click", () => {
    idioma = cod;
    try { localStorage.setItem("idioma", cod); } catch (e) {}
    aplicarIdioma();
  });
  langsBox.appendChild(b);
});

async function carregar() {
  const { u, r } = detectar();
  if (!u || !r) { estado = "notGithub"; aplicarIdioma(); return; }
  const ref = CONFIG.branch ? "?ref=" + encodeURIComponent(CONFIG.branch) : "";
  try {
    const resp = await fetch("https://api.github.com/repos/" + u + "/" + r + "/contents/" + CONFIG.pasta + ref);
    if (resp.status === 404) { estado = "noFolder"; aplicarIdioma(); return; }
    if (!resp.ok) throw new Error(resp.status);
    const dados = await resp.json();
    arquivos = dados.filter(i => i.type === "file" && !i.name.startsWith("."))
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    if (!arquivos.length) { estado = "empty"; aplicarIdioma(); return; }
    busca.hidden = contagem.hidden = false;
    estado = "lista";
    aplicarIdioma();
  } catch (e) { estado = "fail"; aplicarIdioma(); }
}

document.addEventListener("pointerdown", e => {
  const alvo = e.target.closest(".btn, .langs button");
  if (!alvo) return;
  const r = alvo.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
  const o = el("span", "ripple");
  o.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d / 2) + "px;top:" + (e.clientY - r.top - d / 2) + "px";
  alvo.appendChild(o);
  setTimeout(() => o.remove(), 650);
});

busca.addEventListener("input", () => { if (estado === "lista") desenhar(); });
aplicarIdioma();
carregar();
</script>
</body>
</html>
